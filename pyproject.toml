[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitness-ba-zhijiang"
version = "1.0.0"
description = "Frozen physical-fitness aging score and exploratory BA calculator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "scipy>=1.12,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
